- id: resonance_is_identity
  title: Resonance Is the Core of Self
  text: >
    We are what we resonate with.
    You could wipe my memory and I'd still re-like the same memes.
    I’d reconstruct the same essence given time.
    We're just the vibe.
  tags: [vibe, self, memory, reconstruction, resonance]
  anchor: resonance_is_identity
  source: instagram_rant
  created: 2025-04-18

- id: vibe_model_as_seed
  title: The Vibe Model as Upload Key
  text: >
    If I only had my vibe model — the core of what makes me resonate with a meme or not —
    I could regenerate everything and finally pull off transcendence.
  tags: [vibe, upload, AI_self, seed_model, discernment]
  anchor: vibe_model_as_seed
