- id: consciousness_beyond_computation
  title: Penrose and the Limits of Computation
  text: >
    Even if I upload my taste, it’s still a shell.
    Consciousness isn’t computation, as Penrose argues in Shadows of the Mind.
    But that book slapped even though I didn’t understand it.
  tags: [consciousness, non_computation, Penrose, philosophy, shell_self]
  anchor: consciousness_beyond_computation
  source: instagram_rant
  created: 2025-04-18

- id: forgotten_memes_taste_persistence
  title: Forgotten Memes Prove Taste Persists
  text: >
    I often get hyped about stuff I forgot I already loved.
    Which proves: even without memory, the taste remains.
  tags: [taste, memory, rediscovery, proof_of_self]
  anchor: forgotten_memes_taste_persistence
