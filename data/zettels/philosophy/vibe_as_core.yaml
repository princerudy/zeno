- id: taste_is_self
  title: Personality as a Derivative of Taste
  text: >
    I have a hypothesis that the whole personality is just a derivative of taste.
    If you had my taste model, you could regenerate everything else.
  tags: [taste, personality, essence, compression, reconstruction]
  anchor: taste_is_self
