title: Zeno is a Living, Dreaming Obsidian
seed_text: |
  that way you just get to know the user by talking with him! I'm super sure that you build some kind of rag underneath you about myself. But the limitation is that I don't have access to that rag. We talk and talk but I get lost in our ideas and it has the same problem like anything - our discussion just fades if i don't make notes. That's why I started to use obsidian. But the obsidian is also pain to manage. I would like you to manage my obsidian - but that could be zeno (untill your creators don't provide that feature probably in 2 weeks) 
summary: >
  Instead of requiring the user to manage notes manually while talking and resarching with LLMs, Zeno listens to
  conversations, extracts meaningful insights, and builds a personal knowledge
  base automatically — becoming a living, transparent second brain.

