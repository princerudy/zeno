core_idea: >
  Most conversations (even profound ones) are lost unless notes are made.
  Traditional tools like Obsidian help, but require manual effort and structure.
  Zeno removes friction by auto-generating and managing your knowledge base as
  you speak. You talk — he thinks, remembers, and builds.

problem: >
  Insights from LLM conversations or human thought are easily lost without
  structured capture. Existing tools like Obsidian are powerful, but require
  active input and maintenance — creating friction and resistance.

solution: >
  Zeno serves as an interactive, AI-powered note system that:
    - Auto-generates zettels and manifests from live conversation
    - Builds a personal RAG under the hood
    - Exposes the mind visually and semantically
    - Syncs with Obsidian or replaces it with a more dynamic frontend

differentiators:
  - Zeno doesn’t just reply — he builds memory.
  - User stays in flow while Zeno handles structure.
  - Exposes reasoning, beliefs, and memory graphically.
  - Creates a recursive, evolving knowledge base with minimal effort.

dream_extension:
  - Seamless sync with Obsidian folders
  - Full-text + semantic search
  - Editable memory UI
  - Conversational refactoring ("Zeno, clean up my notes on power")

